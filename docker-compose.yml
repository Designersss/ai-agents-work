services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vimla
      POSTGRES_USER: vimla
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vimla -d vimla"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - vimla_postgres:/var/lib/postgresql/data

volumes:
  vimla_postgres:
