services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vimla
      POSTGRES_USER: vimla
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vimla -d vimla"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - vimla_postgres:/var/lib/postgresql/data

  # Local development only. Mailpit receives *real* verification SMTP messages,
  # but deliberately does not deliver them to external mailboxes.
  # Never use this service as the production transactional email provider.
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["local-mail"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    environment:
      MP_MAX_MESSAGES: 1000

volumes:
  vimla_postgres:
